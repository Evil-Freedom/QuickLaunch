plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.workbuddy.quicklaunch'
    compileSdk 36

    defaultConfig {
        applicationId "com.workbuddy.quicklaunch"
        minSdk 24
        targetSdk 36          // Android 16
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../quicklaunch-release.jks")
            storePassword System.getenv("QL_STORE_PASSWORD") ?: "quicklaunch"
            keyAlias System.getenv("QL_KEY_ALIAS") ?: "quicklaunch"
            keyPassword System.getenv("QL_KEY_PASSWORD") ?: "quicklaunch"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'   // enableEdgeToEdge
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'

    testImplementation 'junit:junit:4.13.2'
}
