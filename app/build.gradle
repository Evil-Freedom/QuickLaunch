plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// 备用签名凭据（signing/ 目录整体不进版本库）。
// 文件不存在时 hasSig2 为 false，下面的 sig2 配置不注入任何值，
// 原 release 变体的行为一字不变 —— 这是「新签名不影响现有发布线」的保证。
def sig2Props = new Properties()
def sig2PropsFile = rootProject.file("signing/keystore.properties")
if (sig2PropsFile.exists()) {
    sig2PropsFile.withInputStream { sig2Props.load(it) }
}
def hasSig2 = sig2PropsFile.exists() && sig2Props.getProperty("storePassword")

android {
    namespace 'com.workbuddy.quicklaunch'
    compileSdk 36

    defaultConfig {
        applicationId "com.workbuddy.quicklaunch"
        minSdk 24
        targetSdk 36          // Android 16
        versionCode 20
        versionName "1.3.16"
        // 桌面名称用占位符注入，让 sig2 包能和正式版区分开
        manifestPlaceholders = [appLabel: "@string/app_name"]
    }

    signingConfigs {
        release {
            storeFile file("../quicklaunch-release.jks")
            storePassword System.getenv("QL_STORE_PASSWORD") ?: "quicklaunch"
            keyAlias System.getenv("QL_KEY_ALIAS") ?: "quicklaunch"
            keyPassword System.getenv("QL_KEY_PASSWORD") ?: "quicklaunch"
        }
        // 第二套签名：独立 keystore + 强口令，与 release 互不干扰。
        // 仅在 signing/keystore.properties 存在时生效，缺失则本配置为空（构建 sig2 会因无签名而失败，属预期）。
        sig2 {
            if (hasSig2) {
                storeFile rootProject.file("signing/quicklaunch-sig2.jks")
                storePassword sig2Props.getProperty("storePassword")
                keyAlias sig2Props.getProperty("keyAlias")
                keyPassword sig2Props.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        // 新签名的验证包：包名加 .sig2 后缀，因此能与正式版同机共存、数据互不可见。
        // 换签名后同包名必然无法覆盖安装（Android 平台限制），加后缀是唯一「不覆盖现有版本」的做法。
        sig2 {
            initWith release
            signingConfig signingConfigs.sig2
            applicationIdSuffix ".sig2"
            versionNameSuffix "-sig2"
            manifestPlaceholders = [appLabel: "快捷启动 S2"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        disable 'HardcodedText', 'UnusedResources', 'MissingDefaultResource'
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'   // enableEdgeToEdge
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'   // 顶部 Segment 驱动的横向分页
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    ksp 'androidx.room:room-compiler:2.7.1'

    testImplementation 'junit:junit:4.13.2'
    // android.jar 里的 org.json 是「未实现」桩，JVM 单测里调用任何方法都会抛
    // RuntimeException("... not mocked")。引入真实实现，让解析器逻辑可被真正验证。
    testImplementation 'org.json:json:20240303'
}
