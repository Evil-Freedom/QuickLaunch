plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.workbuddy.quicklaunch'
    compileSdk 36

    defaultConfig {
        applicationId "com.workbuddy.quicklaunch"
        minSdk 24
        targetSdk 36          // Android 16
        versionCode 8
        versionName "1.3.4"
    }

    signingConfigs {
        release {
            storeFile file("../quicklaunch-release.jks")
            storePassword System.getenv("QL_STORE_PASSWORD") ?: "quicklaunch"
            keyAlias System.getenv("QL_KEY_ALIAS") ?: "quicklaunch"
            keyPassword System.getenv("QL_KEY_PASSWORD") ?: "quicklaunch"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        disable 'HardcodedText', 'UnusedResources', 'MissingDefaultResource'
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'   // enableEdgeToEdge
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'   // 顶部 Segment 驱动的横向分页
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    ksp 'androidx.room:room-compiler:2.7.1'

    testImplementation 'junit:junit:4.13.2'
    // android.jar 里的 org.json 是「未实现」桩，JVM 单测里调用任何方法都会抛
    // RuntimeException("... not mocked")。引入真实实现，让解析器逻辑可被真正验证。
    testImplementation 'org.json:json:20240303'
}
