<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QuickLaunch 远程{% endblock %}</title>
<style>
  :root {
    --bg: #0f1216; --card: #171b21; --line: #262c34;
    --text: #e8edf3; --dim: #8b96a5; --accent: #4a9eff; --warn: #ffb020; --bad: #ff5a5a; --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex;
           align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header nav { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  header nav a { color: var(--dim); text-decoration: none; font-size: 13px; }
  header nav a:hover, header nav a.on { color: var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 22px 20px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; color: var(--dim);
             text-transform: uppercase; letter-spacing: .6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--dim); font-weight: 500; }
  input, select { background: #0c0f13; color: var(--text); border: 1px solid var(--line);
                  border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  input[type=number] { width: 78px; }
  button { background: var(--accent); color: #06121f; border: 0; border-radius: 6px;
           padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  button.bad { background: var(--bad); color: #1a0505; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--dim); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
         border: 1px solid var(--line); color: var(--dim); }
  .tag.on { color: var(--ok); border-color: #1e4a37; }
  .tag.off { color: var(--bad); border-color: #4a1e1e; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .secret { background: #0c0f13; border: 1px dashed var(--warn); border-radius: 8px;
            padding: 10px 12px; margin-top: 10px; word-break: break-all; }
  .secret b { color: var(--warn); }
  footer { color: var(--dim); font-size: 12px; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<header>
  <h1>QuickLaunch 远程</h1>
  <nav>
    <a href="/rules" class="{% if page == 'rules' %}on{% endif %}">规则</a>
    <a href="/versions" class="{% if page == 'versions' %}on{% endif %}">版本</a>
    <a href="/devices" class="{% if page == 'devices' %}on{% endif %}">设备</a>
    <a href="/audit" class="{% if page == 'audit' %}on{% endif %}">日志</a>
    <form method="post" action="/logout" style="display:inline;margin:0">
      <button class="ghost" style="padding:2px 10px">退出</button>
    </form>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>仅服务你自己的授权设备</footer>
</body>
</html>
