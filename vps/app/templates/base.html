<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}QuickLaunch 远程{% endblock %}</title>
<style>
  :root {
    --bg: #0f1216; --card: #171b21; --line: #262c34;
    --text: #e8edf3; --dim: #8b96a5; --accent: #4a9eff; --warn: #ffb020; --bad: #ff5a5a; --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex;
           align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header nav { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  header nav a { color: var(--dim); text-decoration: none; font-size: 13px; }
  header nav a:hover, header nav a.on { color: var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 22px 20px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; color: var(--dim);
             text-transform: uppercase; letter-spacing: .6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--dim); font-weight: 500; }
  input, select { background: #0c0f13; color: var(--text); border: 1px solid var(--line);
                  border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  input[type=number] { width: 78px; }
  button { background: var(--accent); color: #06121f; border: 0; border-radius: 6px;
           padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  button.bad { background: var(--bad); color: #1a0505; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--dim); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
         border: 1px solid var(--line); color: var(--dim); }
  .tag.on { color: var(--ok); border-color: #1e4a37; }
  .tag.off { color: var(--bad); border-color: #4a1e1e; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .secret { background: #0c0f13; border: 1px dashed var(--warn); border-radius: 8px;
            padding: 10px 12px; margin-top: 10px; word-break: break-all; }
  .secret b { color: var(--warn); }
  footer { color: var(--dim); font-size: 12px; text-align: center; padding: 24px 0; }

  /* ═══ 规则卡片（对齐 Android 的 item_automation） ═══
     层级与 App 一致：状态点 → 名称+开关 → 触发标签 → 描述 → 操作按钮。 */
  .rule-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
               padding: 14px 16px; margin-bottom: 12px; }
  .rule-head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(62,207,142,.55); }
  .rule-name { font-size: 15px; font-weight: 600; flex: 1; min-width: 0;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rule-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .rule-desc { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .rule-actions { display: flex; gap: 8px; margin-top: 12px; }
  .rule-actions a, .rule-actions button { flex: 1; text-align: center; text-decoration: none;
      padding: 7px 0; font-size: 13px; border-radius: 8px; border: 1px solid var(--line);
      background: transparent; color: var(--text); font-weight: 500; }
  .rule-actions .primary { border-color: var(--accent); color: var(--accent); }

  /* ═══ 开关（仿 Android Switch） ═══ */
  .sw { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: #2c333d; border-radius: 999px;
             transition: background .18s; cursor: pointer; }
  .sw span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px;
             top: 3px; background: #96a0ae; border-radius: 50%; transition: all .18s; }
  .sw input:checked + span { background: rgba(74,158,255,.35); }
  .sw input:checked + span::after { left: 21px; background: var(--accent); }

  /* ═══ 分段 / 胶囊选择（触发条件、重复） ═══ */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  .chip label { display: inline-block; padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--dim); font-size: 13px; cursor: pointer;
      user-select: none; }
  .chip input:checked + label { background: rgba(74,158,255,.16); border-color: var(--accent);
      color: var(--accent); font-weight: 600; }

  /* ═══ 星期多选（星期日一二三四五六） ═══ */
  .days { display: flex; gap: 8px; }
  .day { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
         background: transparent; color: var(--dim); font-size: 13px; cursor: pointer;
         display: flex; align-items: center; justify-content: center; }
  .day.on { background: rgba(74,158,255,.18); border-color: var(--accent); color: var(--accent);
            font-weight: 600; }

  /* ═══ 表单 ═══ */
  .field { margin-bottom: 18px; }
  .field > .lbl { display: block; color: var(--dim); font-size: 12px; margin-bottom: 8px;
                  text-transform: none; letter-spacing: .2px; }
  .field input[type=text], .field input[type=time], .field select {
      width: 100%; padding: 10px 12px; font-size: 14px; }
  .pick { display: flex; align-items: center; gap: 10px; }
  .pick .big { font-size: 22px; font-variant-numeric: tabular-nums; }
  .opt { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .opt .txt { font-size: 13px; line-height: 1.45; }
  .opt .sub { color: var(--dim); font-size: 12px; }
  .hidden { display: none !important; }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; }
  .banner.warn { background: rgba(255,176,32,.12); border: 1px solid rgba(255,176,32,.4); color: #ffd27a; }
  .banner.bad { background: rgba(255,90,90,.12); border: 1px solid rgba(255,90,90,.4); color: #ff9c9c; }
  .save-bar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%);
              padding: 16px 0 8px; }
  .save-bar button { width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; }
  /* 窄屏：顶栏的导航必须换到第二行。
     否则「QuickLaunch 远程 + 5 个链接 + 退出」总宽超过手机视口，
     整页被撑宽 —— 卡片右侧的开关和按钮会被挤出屏幕。 */
  @media (max-width: 700px) {
    header { padding: 12px 14px; gap: 10px; }
    header nav { margin-left: 0; width: 100%; gap: 12px; }
  }
  @media (max-width: 520px) {
    main { padding: 16px 14px 40px; }
    .day { width: 34px; height: 34px; }
  }
  /* 兜底：任何意外溢出都不产生横向滚动（手机上横向滚动条比裁切更烦人） */
  body { overflow-x: hidden; }
  main { overflow-x: hidden; }
</style>
</head>
<body>
<header>
  <h1>QuickLaunch 远程</h1>
  <nav>
    <a href="/rules" class="{% if page == 'rules' %}on{% endif %}">规则</a>
    <a href="/versions" class="{% if page == 'versions' %}on{% endif %}">版本</a>
    <a href="/devices" class="{% if page == 'devices' %}on{% endif %}">设备</a>
    <a href="/unlock" class="{% if page == 'unlock' %}on{% endif %}">自动解锁</a>
    <a href="/audit" class="{% if page == 'audit' %}on{% endif %}">日志</a>
    <form method="post" action="/logout" style="display:inline;margin:0">
      <button class="ghost" style="padding:2px 10px">退出</button>
    </form>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>仅服务你自己的授权设备</footer>
</body>
</html>
