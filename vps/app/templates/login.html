{% extends "base.html" %}
{% block title %}登录 · QuickLaunch{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h2>管理员登录</h2>
  {% if error %}<p style="color:#ff5a5a;margin:0 0 10px">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <div class="row">
      <input type="password" name="password" placeholder="口令" autofocus
             style="flex:1;min-width:180px" autocomplete="current-password">
      <button type="submit">登录</button>
    </div>
  </form>
  <p class="hint">连续输错 5 次将锁定 10 分钟。</p>
</div>
{% endblock %}
