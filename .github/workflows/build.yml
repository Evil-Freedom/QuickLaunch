name: 自动编译 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译所需 SDK 包
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: 编译 Debug APK（自动用 debug 签名，可直接安装）
        uses: gradle/gradle-build-action@v3
        with:
          # 本工程未带 gradle wrapper，由 action 下载指定版本执行
          gradle-version: 8.6
          arguments: assembleDebug

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: quicklaunch-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # 如需生成可上架的 Release 签名 APK，在仓库 Settings → Secrets 配置以下变量后启用：
  #   KEYSTORE_BASE64 : 把 .jks 用 base64 编码后整段粘贴
  #   KEY_ALIAS / KEY_PASSWORD / KEYSTORE_PASSWORD
  # 并改用 `assembleRelease` 与下面的签名步骤。
