name: 自动编译 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 16 编译所需 SDK 包
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 准备 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 跑单元测试（时间计算逻辑）
        run: gradle testDebugUnitTest --no-daemon

      - name: 编译 Debug APK（自动 debug 签名，可直接安装）
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug 产物
        uses: actions/upload-artifact@v4
        with:
          name: quicklaunch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 编译 Release APK（正式签名，可上架/长期覆盖安装）
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 上传 Release 产物
        uses: actions/upload-artifact@v4
        with:
          name: quicklaunch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
